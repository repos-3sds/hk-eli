apiVersion: apps/v1
kind: Deployment
metadata:
  name: hk-eli-chatbot-web
  labels: {app.kubernetes.io/name: hk-eli-chatbot-web, app.kubernetes.io/part-of: hk-eli-chatbot, app.kubernetes.io/component: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: hk-eli-chatbot-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hk-eli-chatbot-web, app.kubernetes.io/part-of: hk-eli-chatbot}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: hk-eli-chatbot-web:latest   # set by kustomize `images:` or `oc set image`
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          envFrom:
            - configMapRef: {name: hk-eli-chatbot-web}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
