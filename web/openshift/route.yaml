# The one public entry point. Users open https://<route-host>/ ; the API stays internal behind nginx.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hk-eli-frontend
  labels: {app.kubernetes.io/name: hk-eli-frontend, app.kubernetes.io/part-of: hk-eli-chatbot}
  annotations:
    haproxy.router.openshift.io/timeout: 120s   # live answers stream for up to two minutes
spec:
  to: {kind: Service, name: hk-eli-frontend}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
