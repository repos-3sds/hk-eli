# Settings for the web service in UAT. Applied at container start; restart the pod after a change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hk-eli-chatbot-web
  labels: {app.kubernetes.io/name: hk-eli-chatbot-web, app.kubernetes.io/part-of: hk-eli-chatbot}
data:
  # Where nginx forwards /api/stork/* and /tableau/* (the agent's internal Service).
  API_URL: http://hk-eli-chatbot-api:8080
  APP_NAME: HK ELI Chatbot
  REQUEST_TIMEOUT_MS: "20000"
  # Pins "today" for the fictional demo book. Empty = the real date in APP_TIMEZONE.
  AS_OF_DATE: "2026-11-19"
  APP_TIMEZONE: Asia/Hong_Kong
  MARKET_HOLIDAYS: 2026-12-25,2026-12-26,2027-01-01
