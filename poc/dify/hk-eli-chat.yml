# HK ELI Chatflow for Dify 1.16. Generated by dify/build_dsl.py; edit that file, not this one.
app:
  name: "HK ELI Chatbot"
  mode: "advanced-chat"
  icon: "📈"
  icon_background: "#0B1F33"
  description: "Orchestrates the HK ELI Chatbot. Python decides the view, filters and every figure; Dify reads the question when the rules are unsure and words the answer. *Will be part of Ask-MIRA in future"
  use_icon_as_answer_icon: false
kind: "app"
version: "0.3.0"
dependencies:
  - current_identifier: null
    type: "marketplace"
    value:
      marketplace_plugin_unique_identifier: "langgenius/gemini"
workflow:
  conversation_variables: []
  environment_variables:
    - id: "env-eli-base"
      name: "ELI_TOOL_BASE_URL"
      value_type: "string"
      value: "http://host.docker.internal:8050"
      description: "Where Dify reaches the HK ELI tool service"
    - id: "env-eli-key"
      name: "ELI_TOOL_KEY"
      value_type: "secret"
      value: ""
      description: "Same value as DIFY_TOOL_KEY on the tool service"
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
      - id: "start"
        data:
          type: "start"
          title: "Start"
          desc: ""
          variables:
            - variable: "request_id"
              label: "request_id"
              type: "text-input"
              required: true
              max_length: 64
              options: []
            - variable: "mode"
              label: "mode"
              type: "select"
              required: false
              options:
                - "answer"
                - "reword"
              default: "answer"
          selected: false
        type: "custom"
        width: 244
        height: 98
        position:
          x: 80
          y: 480
        positionAbsolute:
          x: 80
          y: 480
        selected: false
        sourcePosition: "right"
        targetPosition: "left"
      - id: "mode"
        data:
          type: "if-else"
          title: "Mode?"
          desc: ""
          cases:
            - id: "reword"
              case_id: "reword"
              logical_operator: "and"
              conditions:
                - id: "mode-c1"
                  varType: "string"
                  variable_selector:
                    - "start"
                    - "mode"
                  comparison_operator: "is"
                  value: "reword"
          selected: false
        type: "custom"
        width: 244
        height: 98
        position:
          x: 380
          y: 480
        positionAbsolute:
          x: 380
          y: 480
        selected: false
        sourcePosition: "right"
        targetPosition: "left"
      - id: "ctx_body"
        data:
          type: "code"
          title: "Context request"
          desc: ""
          code_language: "python3"
          code: |
            import json


            def main(request_id: str) -> dict:
                return {"body": json.dumps({"request_id": request_id or ""})}
          variables:
            - variable: "request_id"
              value_selector:
                - "start"
                - "request_id"
          outputs:
            body:
              type: "string"
              children: null
          selected: false
        type: "custom"
        width: 244
        height: 98
        position:
          x: 680
          y: 300
        positionAbsolute:
          x: 680
          y: 300
        selected: false
        sourcePosition: "right"
        targetPosition: "left"
      - id: "context"
        data:
          type: "http-request"
          title: "Context"
          desc: "Python's rules reading of the question and, if the rules are unsure, the understand prompt."
          method: "post"
          url: "{{#env.ELI_TOOL_BASE_URL#}}/tools/context"
          authorization:
            type: "api-key"
            config:
              type: "bearer"
              api_key: "{{#env.ELI_TOOL_KEY#}}"
          headers: "Content-Type:application/json"
          params: ""
          body:
            type: "raw-text"
            data:
              - type: "text"
                value: "{{#ctx_body.body#}}"
          timeout:
            max_connect_timeout: 10
            max_read_timeout: 60
            max_write_timeout: 10
          retry_config:
            enabled: false
            max_retries: 0
            retry_interval: 100
          ssl_verify: true
          selected: false
        type: "custom"
        width: 244
        height: 98
        position:
          x: 980
          y: 300
        positionAbsolute:
          x: 980
          y: 300
        selected: false
        sourcePosition: "right"
        targetPosition: "left"
      - id: "ctx"
        data:
          type: "code"
          title: "Read context"
          desc: ""
          code_language: "python3"
          code: |
            import json


            def main(status_code: int, body: str) -> dict:
                if status_code != 200:
                    raise ValueError(f"ELI_TOOL_{status_code}: {body[:200]}")
                d = json.loads(body)
                return {"needs_model": str(d.get("needs_model", "")), "rules_intent": str(d.get("rules_intent", "")), "understand_system": str(d.get("understand_system", "")), "understand_user": str(d.get("understand_user", ""))}
          variables:
            - variable: "status_code"
              value_selector:
                - "context"
                - "status_code"
            - variable: "body"
              value_selector:
                - "context"
                - "body"
          outputs:
            needs_model:
              type: "string"
              children: null
            rules_intent:
              type: "string"
              children: null
            understand_system:
              type: "string"
              children: null
            understand_user:
              type: "string"
              children: null
          selected: false
        type: "custom"
        width: 244
