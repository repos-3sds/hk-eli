# Runs both UAT images together on one machine, the same way OpenShift wires them:
# the browser talks only to the web service (:8081), which forwards /api/stork and /tableau to the agent.
#   docker compose -f compose.uat.yaml up --build      then open http://localhost:8081
# (After the repo split each repo builds its own image; this file stays here as the local check.)
services:
  hk-eli-backend:
    build: ./poc
    image: hk-eli-backend:local
    user: "1000770000:0"          # a random UID like OpenShift's
    read_only: true
    tmpfs: [/tmp]
    volumes: [api-var:/app/var]
    environment:
      DEFAULT_USER: uat.user
      # LLM_MODE: gateway         # plus LLM_GATEWAY_URL and LLM_API_KEY for live Gemini wording
  hk-eli-frontend:
    build: ./web
    image: hk-eli-frontend:local
    user: "1000770000:0"
    depends_on: [hk-eli-backend]
    environment:
      API_URL: http://hk-eli-backend:8080
      AS_OF_DATE: "2026-11-19"
    ports: ["8081:8080"]
volumes:
  api-var: {}
